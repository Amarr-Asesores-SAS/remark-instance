name: ewcam-remark

services:
  remark42:
    image: ghcr.io/umputun/remark42:v1.16.4
    container_name: ewcam-remark42
    restart: unless-stopped
    env_file: .env
    ports:
      # Solo loopback del VPS. El nginx del host hace el proxy y termina TLS.
      - "127.0.0.1:9081:8080"
    volumes:
      - ./var:/srv/var
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
