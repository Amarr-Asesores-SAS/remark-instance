# vhost para el nginx del VPS.  Refleja el estado ya gestionado por certbot
# (listen 443 ssl + server :80 -> 301).  En una caja nueva:
#   1) comenta las 6 lineas "# managed by Certbot" y el bloque server :80,
#      deja solo `listen 80;`
#   2) sudo cp deploy/comments.ewcam.co.nginx.conf /etc/nginx/sites-available/comments.ewcam.co
#      sudo ln -s /etc/nginx/sites-available/comments.ewcam.co /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   3) sudo certbot --nginx -d comments.ewcam.co   # reescribe esas lineas
#
# El panel /admin sale de ESTE fichero: alias al clon del repo + basic auth.
# El htpasswd DEBE ser  admin:<ADMIN_PASSWD del .env>  para que nginx pueda
# reenviar la credencial a Remark42 en /api/v1/admin/*.
#   sudo apt install -y apache2-utils
#   set -a; . <clon>/.env; set +a
#   sudo htpasswd -bc /etc/nginx/remark-admin.htpasswd admin "$ADMIN_PASSWD"

server {
    server_name comments.ewcam.co;

    # Remark42 acepta imagenes hasta IMAGE_MAX_SIZE (1 MB). Margen para multipart.
    client_max_body_size 2m;

    # --- Panel de moderacion interno --------------------------------------
    location = /admin { return 301 /admin/; }

    location /admin/ {
        auth_basic           "remark admin";
        auth_basic_user_file /etc/nginx/remark-admin.htpasswd;

        alias /opt/remark-instance/admin/;   # <-- AJUSTAR a <clon>/admin/
        index index.html;
        # version.json lo genera scripts/deploy.sh; si falta, el panel dice "dev"
    }

    # API de moderacion: mismo basic auth. nginx valida contra el htpasswd y
    # reenvia el header Authorization a Remark42, que lo revalida.
    location ^~ /api/v1/admin/ {
        auth_basic           "remark admin";
        auth_basic_user_file /etc/nginx/remark-admin.htpasswd;

        proxy_pass http://127.0.0.1:9081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;            # export de sitios grandes
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:9081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/comments.ewcam.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/comments.ewcam.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = comments.ewcam.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name comments.ewcam.co;
    return 404; # managed by Certbot
}
