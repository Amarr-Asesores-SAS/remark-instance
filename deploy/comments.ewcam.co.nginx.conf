# vhost para el nginx del VPS.
#   sudo cp deploy/comments.ewcam.co.nginx.conf /etc/nginx/sites-available/comments.ewcam.co
#   sudo ln -s /etc/nginx/sites-available/comments.ewcam.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d comments.ewcam.co   # anade el bloque 443 + redirect
#
# NOTA: si el bloque `listen 443 ssl` ya existe (certbot lo edito in-place en el
# fichero de /etc/nginx/sites-*), copia tambien ahi las tres `location` de abajo
# (/admin, /admin/, ^~ /api/v1/admin/), o re-ejecuta `certbot --nginx` para que
# resincronice el server block de 443 desde este.

server {
    listen 80;
    listen [::]:80;
    server_name comments.ewcam.co;

    # Remark42 acepta imagenes hasta IMAGE_MAX_SIZE (1 MB). Margen para multipart.
    client_max_body_size 2m;

    # --- Panel de moderacion interno -------------------------------------
    # Estatico servido desde el repo. Basic auth propio (htpasswd separado).
    # El htpasswd DEBE ser  admin:<ADMIN_PASSWD del .env>  para que la misma
    # credencial valga tambien en /api/v1/admin/* (nginx la reenvia a Remark42).
    #   sudo apt install apache2-utils   # trae htpasswd
    #   source /opt/remark-instance/.env
    #   sudo htpasswd -bc /etc/nginx/remark-admin.htpasswd admin "$ADMIN_PASSWD"
    location = /admin { return 301 /admin/; }

    location /admin/ {
        auth_basic           "remark admin";
        auth_basic_user_file /etc/nginx/remark-admin.htpasswd;

        root /opt/remark-instance;          # sirve /opt/remark-instance/admin/
        try_files $uri $uri/ /admin/index.html;
    }

    # API de moderacion: mismo basic auth que el panel. nginx valida contra el
    # htpasswd y reenvia el header Authorization a Remark42, que lo revalida.
    location ^~ /api/v1/admin/ {
        auth_basic           "remark admin";
        auth_basic_user_file /etc/nginx/remark-admin.htpasswd;

        proxy_pass http://127.0.0.1:9081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;            # export de sitios grandes
        proxy_connect_timeout 5s;
    }

    location / {
        proxy_pass http://127.0.0.1:9081;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
